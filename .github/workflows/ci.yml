name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: 40-build/pnpm-lock.yaml
      - name: Install
        run: pnpm -C 40-build install --frozen-lockfile
      - name: Check
        run: pnpm -C 40-build check
      - name: Build
        run: |
          pnpm -C 40-build build
          pnpm -C 40-build web:build
          pnpm -C 40-build manager:build
